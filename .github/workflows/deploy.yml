name: Deploy para GitHub Pages (produção + homologação)

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar main (produção)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _src/main

      - name: Baixar develop (homologação)
        uses: actions/checkout@v4
        with:
          ref: develop
          path: _src/develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build main (base /rocada/)
        working-directory: _src/main
        run: npm install && npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build develop (base /rocada/teste/)
        working-directory: _src/develop
        run: npm install && npm run build
        env:
          VITE_BASE: /rocada/teste/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Montar o site (main na raiz, develop em /teste)
        run: |
          mkdir -p _site
          cp -r _src/main/dist/. _site/
          mkdir -p _site/teste
          cp -r _src/develop/dist/. _site/teste/
          # O GitHub Pages serve UM ÚNICO 404 (o da raiz) para todos os caminhos.
          # Torna-o "esperto": se o 2º segmento for 'teste', preserva 2 segmentos
          # (/rocada/teste); senão, 1 (/rocada). Assim as rotas do /teste não caem
          # na produção. Vale para a raiz e para dentro do /teste.
          SMART="var segmentsToKeep = (location.pathname.split('/')[2] === 'teste') ? 2 : 1;"
          for f in _site/404.html _site/teste/404.html; do
            [ -f "$f" ] && sed -i "s#var segmentsToKeep = 1;#${SMART}#" "$f"
          done
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
