<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Controle de Roçadas - Rede Municipal de Educação" />
    <title>Sistema de Roçadas</title>
    <script>
      // Restaura a rota exata salva pelo 404.html
      // Roda antes do React carregar, garantindo a rota correta
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') +
            l.hash
          );
        }
      }(window.location));
    </script>
    <!-- Controle de Acesso CENTRAL (login + telas) — SOMENTE nesta build (develop / /teste).
         A produção (main) não carrega isto e mantém o login próprio do Roçadas.
         Injeção dinâmica: o Vite não tenta resolver os caminhos /central/ no build. -->
    <script>
      window.ACESSO_SISTEMA = 'rocada';
      window.ACESSO_LOGIN = '/central/login.html';
      (function () {
        ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
         '/central/config.js',
         '/central/acesso-sme.js'].forEach(function (src) {
          var s = document.createElement('script');
          s.src = src; s.async = false; document.head.appendChild(s);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
